<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 36px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        h1::before {
            content: '🎓';
            font-size: 1.2em;
        }
        
        .welcome-text {
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 18px;
            line-height: 1.6;
            font-weight: 500;
        }
        
        .portal-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .role-section {
            flex: 1;
            min-width: 300px;
            margin: 0;
            padding: 30px;
            border-radius: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .role-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        
        .role-section.admin {
            border-left: 6px solid #667eea;
        }
        
        .role-section.teacher {
            border-left: 6px solid #4facfe;
        }
        
        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        h2::before {
            font-size: 1.2em;
        }
        
        .role-section.admin h2::before {
            content: '🔐';
        }
        
        .role-section.teacher h2::before {
            content: '👨‍🏫';
        }
        
        .role-description {
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 14px 30px;
            margin: 10px 5px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-login.teacher {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .btn-register {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-register.teacher {
            color: #4facfe;
            border-color: #4facfe;
        }
        
        .btn-register:hover {
            background: #667eea;
            color: white;
        }
        
        .btn-register.teacher:hover {
            background: #4facfe;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Attendance Management System</h1>
        <p class="welcome-text">Choose your role to get started</p>
        
        <div class="portal-container">
            <div class="role-section admin">
                <h2>Admin Portal</h2>
                <p class="role-description">Manage courses, students, and generate reports</p>
                <a href="admin/adminLogin.jsp" class="btn btn-login">Admin Login</a>
                <a href="/AttendanceSystem/register?page=adminRegister" class="btn btn-register">Register Admin</a>
            </div>
            
            <div class="role-section teacher">
                <h2>Teacher Portal</h2>
                <p class="role-description">Mark attendance and view class reports</p>
                <a href="teacher/teacherLogin.jsp" class="btn btn-login teacher">Teacher Login</a>
                <a href="/AttendanceSystem/register?page=teacherRegister" class="btn btn-register teacher">Register Teacher</a>
            </div>
        </div>
    </div>
</body>
</html>
